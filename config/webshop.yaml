defaults:
  - base
  - _self_

micro_batch_size_per_gpu: 1

trainer:
  experiment_name: webshop
  default_local_dir: results/checkpoints/webshop

agent_proxy:
  max_turn: 9
  max_actions_per_turn: 1

actor_rollout_ref:
  rollout:
    max_model_len: 15000
    max_num_batched_tokens: 15000

es_manager:
  train:
    env_configs:
      tags: [WebShop]
      n_groups: [8]
  val:
    env_configs:
      tags: [WebShop]
      n_groups: [32]
