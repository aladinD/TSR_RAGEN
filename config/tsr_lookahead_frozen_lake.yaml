defaults:
  - frozen_lake
  - _self_

actor_rollout_ref:
  rollout:
    rollout_filter_ratio: 0.5

tsr_lookahead:
  enabled: true
  keep_ratio: 0.5
  min_keep_per_group: 1
  tied_return_eps: 1e-3
  add_random_keep: true
  random_keep_count: 1

agent_proxy:
  batch_adjust_mode: delete

trainer:
  experiment_name: tsr_lookahead_frozen_lake
  default_local_dir: results/checkpoints/tsr_lookahead_frozen_lake
